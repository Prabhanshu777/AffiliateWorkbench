<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Manager - Affiliate Deal Workbench</title>
    
        <!-- PWA Manifest & Mobile App Settings -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script>
        (function() {
            var theme = localStorage.getItem("workbench_theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/deals.css">
</head>
<body>

    <!-- TOP NAVIGATION -->
    <nav class="top-nav">
        <div class="nav-logo">⚡ Deal Manager</div>
        
        <button 
            type="button" 
            id="themeToggleBtn" 
            class="theme-toggle-btn" 
            title="Toggle Theme"
            onclick="toggleTheme()"
        >
            🌙
        </button>

        <div class="nav-links">
            <a href="index.html" class="nav-link">🏠 Dashboard</a>
            <a href="deals.html" class="nav-link active">💰 Deals</a>
            <a href="image-studio.html" class="nav-link">🖼️ Image Studio</a>
            <a href="content.html" class="nav-link">✍️ Content</a>
            <a href="post-builder.html" class="nav-link">📱 Post Builder</a>
            <a href="settings.html" class="nav-link">⚙️ Settings</a>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="app-header">
        <h1>💰 Deal Manager</h1>
        <p>Save and organize your affiliate product deals</p>
    </header>

    <main>
        <!-- ADD DEAL FORM -->
        <section class="app-section">
            <div class="deal-form">
                <h2>Add / Edit Deal</h2>
                <p class="section-description">Save product details, discounts, and affiliate links.</p>

                <label for="productName">Product Name *</label>
                <input type="text" id="productName" placeholder="Example: Running Shoes" required>

                <label for="store">Store *</label>
                <input type="text" id="store" placeholder="Example: Amazon / Myntra" required>

                <label for="productUrl">Product Affiliate URL</label>
                <input type="url" id="productUrl" placeholder="https://example.com/product-link">

                <label for="price">Deal Price (₹) *</label>
                <input type="number" id="price" placeholder="999" required>

                <label for="originalPrice">Original Price (₹) *</label>
                <input type="number" id="originalPrice" placeholder="2999" required>

                <label for="coupon">Coupon Code</label>
                <input type="text" id="coupon" placeholder="Optional: SAVE20">

                <button type="button" id="saveDeal" style="width: 100%; margin-top: 18px; padding: 13px;">
                    Save Deal
                </button>
            </div>
        </section>

        <!-- DEALS LIST -->
        <section class="app-section">
            <div class="deal-list-section">
                <h2>Your Saved Deals</h2>
                <input type="search" id="searchDeals" placeholder="🔎 Search by name, store, or coupon...">
                <div id="dealList"></div>
            </div>
        </section>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/deals.js"></script>
</body>
</html>
